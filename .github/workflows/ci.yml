name: Testar Ping e DNS do Google

on:
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub
  schedule:
    - cron: '0 16 * * *' # Roda a cada 1 hora (ajuste conforme necessário)

jobs:
  ping-dns-check:
    runs-on: ubuntu-latest
    steps:
      - name: Executar teste de Ping e DNS
        run: |
          IP_GOOGLE="8.8.8.8"
          DOMINIO="google.com"
          DATA_HORA=$(date "+%Y-%m-%d %H:%M:%S")

          echo "Iniciando teste em $DATA_HORA"

          # 1. Teste de Ping
          if ping -c 1 -W 2 $IP_GOOGLE &> /dev/null; then
              echo "PING: [ONLINE] - IP $IP_GOOGLE está acessível."
          else
              echo "PING: [OFFLINE] - Falha ao alcançar $IP_GOOGLE."
              exit 1
          fi

          # 2. Teste de DNS
          if nslookup $DOMINIO &> /dev/null; then
              echo "DNS: [OK] - Domínio $URL resolvido com sucesso."
          else
              echo "DNS: [FALHOU] - Falha na resolução de $DOMINIO."
              exit 1
          fi